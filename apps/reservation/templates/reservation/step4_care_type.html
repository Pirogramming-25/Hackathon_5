{% extends "reservation/_base.html" %}
{% load static %}

{% block title %}효도클릭 - 진료 유형 선택{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'reservation/css/care_type.css' %}">
{% endblock %}

{% block content %}

  <header class="care-header">
    <a href="{% url 'reservation:time' %}" class="back-btn" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
        <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <h1>진료 유형 선택</h1>
  </header>

  <p class="care-guide">진료 유형을 선택해주세요</p>

  <div class="dept-tabs" id="deptTabs"></div>

  <section class="symptom-list" id="symptomList"></section>

  <div class="confirm-wrap">
    <button type="button" class="confirm-btn" id="confirmCare" data-next-url="{% url 'reservation:payment' %}" disabled>다음</button>
  </div>

  <div class="review-chip" id="reviewChip" role="button" tabindex="0">
    <span class="review-chip__icon">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
        <path d="M4 8a2 2 0 0 1 2-2h1.2l.9-1.4A2 2 0 0 1 9.8 3.7h4.4a2 2 0 0 1 1.7.9L16.8 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </span>
    찰칵 ! 도와주세요 !
  </div>

{% endblock %}

{% block extra_js %}
  <script src="{% static 'reservation/js/care_type.js' %}"></script>
{% endblock %}
