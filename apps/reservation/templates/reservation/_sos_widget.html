<div class="sos-widget" id="sosWidget" data-sos-url="{% url 'reservation:sos_request' %}">
  <button type="button" class="sos-trigger" id="sosTrigger">
    <span class="sos-trigger__icon">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
        <path d="M4 8a2 2 0 0 1 2-2h1.2l.9-1.4A2 2 0 0 1 9.8 3.7h4.4a2 2 0 0 1 1.7.9L16.8 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </span>
    찰칵 ! 도와주세요 !
  </button>

  <div class="sos-panel" id="sosPanel" hidden>
    <div class="sos-panel__body">
      <div class="sos-panel__header">
        <span class="sos-panel__title" id="sosStatusTitle">화면을 캡처하고 있어요</span>
        <button type="button" class="sos-panel__close" id="sosClose" aria-label="닫기">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <p class="sos-panel__desc" id="sosStatusDesc">잠시만 기다려주세요.</p>
      <div class="sos-spinner" id="sosSpinner"></div>
    </div>
  </div>
</div>
