{% extends "reservation/_base.html" %}
{% load static %}

{% block title %}효도클릭 - 예약금 결제{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'reservation/css/payment.css' %}">
{% endblock %}

{% block content %}

  <header class="payment-header">
    <a href="{% url 'reservation:care_type' %}" class="back-btn" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
        <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <h1>예약금 결제</h1>
  </header>

  <p class="payment-notice">예약금은 진료 대기 시간을 줄이기 위해 사용됩니다.</p>

  <section class="payment-box">
    <div class="deposit-row">
      <span>예약금</span>
      <span class="deposit-amount">10,000원</span>
    </div>

    <p class="method-label">결제 수단 선택</p>

    <div class="method-list" id="methodList">
      <label class="method-item">
        <span class="method-radio"></span>
        <input type="radio" name="payment-method" value="card" hidden>
        카드 결제
      </label>
      <label class="method-item">
        <span class="method-radio"></span>
        <input type="radio" name="payment-method" value="easy" hidden>
        간편 결제
      </label>
    </div>
  </section>

  <div class="confirm-wrap">
    <button type="button" class="confirm-btn" id="confirmPayment" data-next-url="{% url 'reservation:confirm' %}" disabled>결제하기</button>
  </div>


{% endblock %}

{% block extra_js %}
  <script src="{% static 'reservation/js/payment.js' %}"></script>
{% endblock %}
