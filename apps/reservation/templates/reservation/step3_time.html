{% extends "reservation/_base.html" %}
{% load static %}

{% block title %}효도클릭 - 시간 선택{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'reservation/css/time.css' %}">
{% endblock %}

{% block content %}

  <header class="time-header">
    <a href="{% url 'reservation:date' %}" class="back-btn" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
        <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <h1>시간 선택</h1>
  </header>

  <p class="selected-date">{{ selected_date|default:"2026.07.19(일)" }}</p>

  <section class="time-grid">
    <button type="button" class="time-btn">09:30</button>
    <button type="button" class="time-btn">13:30</button>
    <button type="button" class="time-btn">10:00</button>
    <button type="button" class="time-btn">14:00</button>
    <button type="button" class="time-btn">10:30</button>
    <button type="button" class="time-btn">14:30</button>
    <button type="button" class="time-btn">11:00</button>
    <button type="button" class="time-btn">15:00</button>
    <button type="button" class="time-btn">11:30</button>
    <button type="button" class="time-btn">15:30</button>
    <button type="button" class="time-btn">12:00</button>
    <button type="button" class="time-btn">16:00</button>
  </section>

  <div class="confirm-wrap">
    <button type="button" class="confirm-btn" id="confirmTime" data-next-url="{% url 'reservation:care_type' %}">다음</button>
  </div>


{% endblock %}

{% block extra_js %}
  <script src="{% static 'reservation/js/time.js' %}"></script>
{% endblock %}
