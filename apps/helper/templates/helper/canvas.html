{% extends "helper/_base.html" %}
{% load static %}
{% block content %}
  <div id="session-status" class="session-status">연결 중...</div>

  <div class="canvas-wrap">
    <canvas id="board"
            width="380" height="600"
            data-request-id="{{ request_id }}"
            data-screenshot-url="{{ screenshot_url }}"></canvas>
  </div>

  <div class="toolbar">
    <button data-tool="pen" class="tool active">✏️ 펜</button>
    <button data-tool="arrow" class="tool">➡️ 화살표</button>
    <button data-tool="circle" class="tool">⭕ 동그라미</button>
    <button data-tool="rect" class="tool">▭ 사각형</button>
    <button data-tool="text" class="tool">📝 메모</button>
    <button data-tool="eraser" class="tool">🧽 지우개</button>
    <button id="reset-btn">🔄 초기화</button>
  </div>

  <button id="complete-btn" class="btn-primary">완료 전송</button>
{% endblock %}
{% block extra_js %}<script src="{% static 'helper/js/canvas.js' %}"></script>{% endblock %}
