{% extends "helper/_base.html" %}
{% load static %}
{% block title %}회원가입 - 효도클릭{% endblock %}
{% block nav %}{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'helper/css/signup.css' %}">{% endblock %}

{% block content %}
<div class="signup">
    <div class="signup-header">
        <button class="btn-back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2>회원가입</h2>
    </div>

    <p class="signup-subtitle">효도 클릭의 회원이 되어주세요</p>

    <div class="signup-card">
        <form id="signup-form" class="signup-form" data-login-url="{% url 'helper:login' %}">
            <label for="name">이름</label>
            <input type="text" name="name" id="name">

            <label for="username">아이디</label>
            <input type="text" name="username" id="username">

            <label for="password">비밀번호</label>
            <div class="password-field">
                <input type="password" name="password" id="password">
                <button type="button" class="btn-toggle-password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
                </button>
            </div>

            <button type="submit" class="btn-signup">회원가입</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'helper/js/auth.js' %}"></script>{% endblock %}
